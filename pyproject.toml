[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "vyro-publishing-scheduler"
version = "1.2.0"
description = "Persistent, idempotent, approval-gated media queue and account-specific performance scoring for VYRO MEDIA."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["pydantic>=2.7,<3", "typer>=0.12,<1", "rich>=13.7,<15", "python-dateutil>=2.9,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1", "mypy>=1.10,<2"]
[project.scripts]
vyro-scheduler = "vyro_publishing_scheduler.cli:app"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
